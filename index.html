<div class="overlay" id="overlay"></div>

<div class="modal" id="registrationModal">
  <button class="modal__close" id="closeRegistrationBtn" type="button">×</button>
  <h2 class="modal__title">Регистрация</h2>

  <form class="registration-form" id="registrationForm">
    <label for="userName">Имя</label>
    <input type="text" id="userName" name="name" placeholder="Введите имя" required>

    <label for="userSurname">Фамилия</label>
    <input type="text" id="userSurname" name="surname" placeholder="Введите фамилию" required>

    <label for="userBirthDate">Дата рождения</label>
    <input type="date" id="userBirthDate" name="birthDate" required>

    <label for="userLogin">Логин</label>
    <input type="text" id="userLogin" name="login" placeholder="Придумайте логин" required>

    <label for="userPassword">Пароль</label>
    <input type="password" id="userPassword" name="password" placeholder="Введите пароль" required>

    <label for="userConfirmPassword">Повторите пароль</label>
    <input type="password" id="userConfirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>

    <button type="submit">Зарегистрироваться</button>
  </form>
</div>
